name: life_rank
description: "Life Rank - Gamify your life like an RPG. Level up your Financial, Career, Habit, Knowledge, and Health."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.0

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.7

  # UI & Fonts
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  percent_indicator: ^4.2.3
  fl_chart: ^0.68.0

  # Animations
  flutter_animate: ^4.5.0
  confetti: ^0.7.0

  # Image
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  uuid: ^4.4.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
